# Settings only. No secrets: those live in secrets.env.

[round]
duration_seconds = 180

[capture]
# Seconds of uncontested sitting to take a free point, before the cat's own multiplier.
seconds_to_capture = 4.0
points_per_second = 1.0
radius = 0.6

[cats.brother]
speed = 1.5
scale = 1.25
capture_multiplier = 1.3
radius = 0.28

[cats.sister]
speed = 3.0
scale = 0.95
capture_multiplier = 1.15
radius = 0.2

[swat]
# Aragorn's swat hits Arwen anywhere within range, whichever way he faces.
# cooldown_seconds applies after a hit; miss_cooldown_seconds after a swat that hits nothing.
miss_cooldown_seconds = 0.7
range = 1.3
stun_seconds = 1.0
cooldown_seconds = 4.0
flee_seconds = 1.5

[stealth]
# Arwen's ability: unseen and unswattable for `seconds`; the cooldown starts when she vanishes.
seconds = 3.0
cooldown_seconds = 9.0

[hide]
# Sister scores this per second while hidden within range of her brother.
points_per_second = 0.5
tease_range = 3.0

[treats]
points = 5
respawn_seconds = 20.0
pickup_radius = 0.5

[mischief]
# Bonus for ticking an item off a cat's mischief list.
points = 15
# How close a cat must pass to knock something over, the small bonus for it, and how long until
# someone puts it back.
knock_radius = 0.45
knock_points = 2
reset_seconds = 25.0

[camera]
height = 9.0
distance = 7.0
follow_lerp = 4.0

[net]
# Two-player online play. No server of ours: Trystero finds the other browser through public Nostr
# relays, then the two connect directly. app_id keeps our rooms apart from other apps using the same code.
app_id = "cats-untitled"
room_code_length = 4
# How often the host sends the whole game state, and the guest its input. Higher is smoother but busier.
snapshots_per_second = 20
inputs_per_second = 30

[secrets]
